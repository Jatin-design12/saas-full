<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="eVegah Rider App - Find and ride electric bikes near you.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="eVegah Rider">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>eVegah Rider</title>
  <link rel="manifest" href="manifest.json">

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- GOOGLE MAPS JAVASCRIPT API                                 -->
  <!-- Replace YOUR_GOOGLE_MAPS_API_KEY with your actual key from -->
  <!-- Google Cloud Console → APIs & Services → Credentials       -->
  <!-- Make sure "Maps JavaScript API" is ENABLED in your project -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC_Pn12n9hRH5jQdxU7hQUOPDy820ehjwo"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.payWithRazorpay = function(options, onSuccess, onFailure) {
      try {
        var rzpOptions = {
          key: options.key,
          amount: options.amount,
          name: options.name || 'Evegah Mobility',
          description: options.description || 'Wallet Top-Up',
          prefill: {
            contact: options.contact || '',
            email: options.email || ''
          },
          theme: {
            color: '#4313B8'
          },
          handler: function(response) {
            onSuccess(response.razorpay_payment_id || ('PAY_' + Date.now()));
          },
          modal: {
            ondismiss: function() {
              if (onFailure) onFailure("Payment cancelled");
            }
          }
        };
        if (options.order_id && typeof options.order_id === 'string' && options.order_id.trim().length > 0) {
          rzpOptions.order_id = options.order_id;
        }
        var rzp = new Razorpay(rzpOptions);
        rzp.on('payment.failed', function(resp) {
          if (onFailure) onFailure(resp.error ? resp.error.description : "Payment failed");
        });
        rzp.open();
      } catch (err) {
        console.error('Razorpay popup error:', err);
        if (onFailure) onFailure(err.message || String(err));
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
